<svg width="1200" height="212" viewBox="0 0 1200 212" fill="none" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <linearGradient id="route-bg" x1="20" y1="18" x2="1180" y2="194" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F9F4EC"/>
      <stop offset="1" stop-color="#F0DFC4"/>
    </linearGradient>
    <linearGradient id="route-line" x1="148" y1="122" x2="1052" y2="104" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#183328"/>
      <stop offset="0.38" stop-color="#6B5A46"/>
      <stop offset="0.68" stop-color="#CD704B"/>
      <stop offset="1" stop-color="#EABC61"/>
    </linearGradient>
  </defs>

  <rect x="10" y="10" width="1180" height="192" rx="32" fill="url(#route-bg)"/>

  <text x="600" y="56" text-anchor="middle" fill="#183328" font-family="Georgia, Times New Roman, serif" font-size="32" font-weight="700">CHINA -&gt; SINGAPORE -&gt; SEOUL -&gt; PARIS</text>
  <text x="600" y="86" text-anchor="middle" fill="#627168" font-family="Arial, Helvetica, sans-serif" font-size="18">roots | study | research | exchange</text>

  <path id="route-path" d="M148 130C268 98 362 88 482 102C596 116 674 148 786 152C886 156 964 138 1052 110" stroke="url(#route-line)" stroke-width="5" stroke-linecap="round" stroke-dasharray="10 10"/>

  <circle cx="148" cy="130" r="10" fill="#183328"/>
  <circle cx="482" cy="102" r="10" fill="#6B5A46"/>
  <circle cx="786" cy="152" r="10" fill="#CD704B"/>
  <circle cx="1052" cy="110" r="10" fill="#EABC61"/>

  <g transform="translate(92 146)">
    <rect width="92" height="38" rx="19" fill="#183328"/>
    <text x="46" y="24" text-anchor="middle" fill="#F9F4EC" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">CHINA</text>
  </g>

  <g transform="translate(414 118)">
    <rect width="136" height="38" rx="19" fill="#3B4A45"/>
    <text x="68" y="24" text-anchor="middle" fill="#F9F4EC" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">SINGAPORE</text>
  </g>

  <g transform="translate(730 160)">
    <rect width="112" height="38" rx="19" fill="#CD704B"/>
    <text x="56" y="24" text-anchor="middle" fill="#FFF8EE" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">SEOUL</text>
  </g>

  <g transform="translate(994 126)">
    <rect width="116" height="38" rx="19" fill="#EABC61"/>
    <text x="58" y="24" text-anchor="middle" fill="#183328" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">PARIS</text>
  </g>

  <circle r="7" fill="#CD704B">
    <animateMotion dur="9s" repeatCount="indefinite" rotate="auto">
      <mpath xlink:href="#route-path"/>
    </animateMotion>
  </circle>
</svg>

